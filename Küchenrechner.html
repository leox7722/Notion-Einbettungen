<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Küchen-Umrechner (US/Metric + Zutaten)</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0f1115;
    --panel:#151923;
    --panel2:#0b0d12;
    --text:#e8eaf0;
    --muted:#a6adbb;
    --border:rgba(255,255,255,.10);
    --shadow: 0 12px 35px rgba(0,0,0,.45);
    --radius: 16px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    padding: 14px;
  }

  .wrap{ max-width: 820px; margin: 0 auto; }

  .card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  header{
    padding: 12px 12px 0 12px;
    border-bottom: none;
    background: transparent;
  }

  header h1{
    margin:0;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .2px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  header p{
    margin: 8px 0 10px 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
  }

  /* “pill” wie beim Recipe Scaler */
  .pill{
    border: 1px solid var(--border);
    background: #0f1320;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
  }

.grid{
  display:grid;
  grid-template-columns: 1fr;
  gap:12px;
  padding:12px;
}

@media(min-width:980px){
  .grid{ grid-template-columns: 1fr 1fr 1fr; }
}


  .panel{
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }

  .panel h2{
    margin:0 0 10px 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }

  label{
    display:block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .row{
    display:grid;
    gap:10px;
    grid-template-columns: 1fr;
    margin-top: 10px;
  }

  @media (min-width:500px){
    .row{ grid-template-columns: 1fr 1fr; }
  }

  input, select{
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel2);
    color: var(--text);
    padding: 10px 10px;
    outline: none;
    width: 100%;
  }

  /* wie im Recipe Scaler: kein blauer Fokus-Schimmer */
  input:focus, select:focus{
    filter: brightness(1.05);
  }

  .actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top: 12px;
  }

  button{
    cursor:pointer;
    border: 1px solid var(--border);
    background: #111522;
    color: var(--text);
    padding: 9px 12px;
    border-radius: 12px;
    font-weight: 600;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: translateY(1px); }

  button.secondary{
    background: #111522;
    color: var(--text);
    opacity: .9;
  }

  .result{
    margin-top:12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    padding: 12px;
  }

  .result .big{
    margin:0;
    white-space: pre-wrap;
    word-wrap: break-word;
    font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }

  .hint{
    margin-top:8px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.35;
  }

  .error{
    margin-top:8px;
    font-size: 12px;
    color: #ff8a8a;
  }

  .footer{
    padding: 0 12px 12px 12px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
  }

  .kbd{
    border: 1px solid var(--border);
    background: #0f1320;
    padding: 2px 6px;
    border-radius: 8px;
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    color: var(--muted);
  }
</style>

</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <h1>🍳 Küchen-Rechner <span class="pill" id="sysPill">System: Metrisch</span></h1>
        <div class="topbar">
          <div style="min-width:260px;">
            <label for="systemSel">Cup-System</label>
            <select id="systemSel">
              <option value="metric" selected>EU (1 cup = 250 ml)</option>
              <option value="us">US (1 cup ≈ 236,588 ml)</option>
            </select>
          </div>
          <div style="min-width:260px;">
            <label for="decGlobal">Dezimalstellen (Standard)</label>
            <select id="decGlobal">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
            </select>
          </div>
        </div>
      </header>

      <div class="grid">
        <!-- Volumen -->
        <section class="panel" id="volPanel">
          <h2>Volumen <span class="pill" id="cupLabelPill">Cup: 250 ml</span></h2>

          <div class="row">
            <div>
              <label for="volValue">Wert</label>
              <input id="volValue" inputmode="decimal" value="1" />
            </div>
            <div>
              <label for="volFrom">Von</label>
              <select id="volFrom"></select>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="volTo">Nach</label>
              <select id="volTo"></select>
            </div>
            <div>
              <label for="volDecimals">Dezimalstellen</label>
              <select id="volDecimals"></select>
            </div>
          </div>

          <div class="actions">
            <button id="volConvert">Umrechnen</button>
            <button class="secondary" id="volSwap">Tauschen</button>
          </div>

          <div class="result">
            <div class="big" id="volOut">—</div>
            <div class="hint" id="volHint">Beispiel: 1 cup → ml</div>
            <div class="error" id="volErr" style="display:none;"></div>
          </div>
        </section>

        <!-- Gewicht -->
        <section class="panel" id="wtPanel">
          <h2>Gewicht</h2>

          <div class="row">
            <div>
              <label for="wtValue">Wert</label>
              <input id="wtValue" inputmode="decimal" value="100" />
            </div>
            <div>
              <label for="wtFrom">Von</label>
              <select id="wtFrom"></select>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="wtTo">Nach</label>
              <select id="wtTo"></select>
            </div>
            <div>
              <label for="wtDecimals">Dezimalstellen</label>
              <select id="wtDecimals"></select>
            </div>
          </div>

          <div class="actions">
            <button id="wtConvert">Umrechnen</button>
            <button class="secondary" id="wtSwap">Tauschen</button>
          </div>

          <div class="result">
            <div class="big" id="wtOut">—</div>
            <div class="hint" id="wtHint">Beispiel: 100 g → oz</div>
            <div class="error" id="wtErr" style="display:none;"></div>
          </div>
        </section>

        <!-- Zutaten: Cup <-> Gramm -->
        <section class="panel" id="ingPanel">
          <h2>Zutaten: Cup ↔ Gramm <span class="pill">abhängig von Zutat</span></h2>

          <div class="row">
            <div>
              <label for="ingAmount">Wert</label>
              <input id="ingAmount" inputmode="decimal" value="1" />
            </div>
            <div>
              <label for="ingMode">Richtung</label>
              <select id="ingMode">
                <option value="cup_to_g" selected>Cups → Gramm</option>
                <option value="g_to_cup">Gramm → Cups</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="ingredientSel">Zutat</label>
              <select id="ingredientSel"></select>
            </div>
            <div>
              <label for="ingDecimals">Dezimalstellen</label>
              <select id="ingDecimals"></select>
            </div>
          </div>

          <div class="actions">
            <button id="ingConvert">Umrechnen</button>
            <button class="secondary" id="ingSwap">Tauschen</button>
          </div>

          <div class="result">
            <div class="big" id="ingOut">—</div>
            <div class="hint" id="ingHint">Beispiel: 1 cup Mehl → g</div>
            <div class="error" id="ingErr" style="display:none;"></div>
          </div>

<script>
  // --- Basics ---
  function $(id){ return document.getElementById(id); }

  function parseNumber(str){
    const cleaned = String(str).trim().replace(/\s/g,"").replace(",", ".");
    if(cleaned === "") return NaN;
    return Number(cleaned);
  }

  function formatNumber(num, decimals){
    const d = Number(decimals);
    if(!isFinite(num)) return "—";
    return num.toFixed(d).replace(".", ",");
  }

  function showError(el, msg){
    el.style.display = msg ? "block" : "none";
    el.textContent = msg || "";
  }

  function fillDecimals(selectEl, defaultVal){
    selectEl.innerHTML = "";
    ["0","1","2","3"].forEach(v=>{
      const opt = document.createElement("option");
      opt.value = v; opt.textContent = v;
      if(v === String(defaultVal)) opt.selected = true;
      selectEl.appendChild(opt);
    });
  }

  function fillSelect(selectEl, items, defaultKey){
    selectEl.innerHTML = "";
    for(const it of items){
      const opt = document.createElement("option");
      opt.value = it.key;
      opt.textContent = it.label;
      if(it.key === defaultKey) opt.selected = true;
      selectEl.appendChild(opt);
    }
  }

  function swapValues(a, b){
    const t = a.value; a.value = b.value; b.value = t;
  }

  // --- Systems: Metric vs US ---
  const SYSTEMS = {
    metric: {
      name: "Metrisch",
      cupMl: 250,
      tspMl: 5,
      tbspMl: 15
    },
    us: {
      name: "US",
      cupMl: 236.5882365,
      tspMl: 4.92892159375,
      tbspMl: 14.78676478125
    }
  };

  function getSystemKey(){ return $("systemSel").value; }
  function getSystem(){ return SYSTEMS[getSystemKey()]; }

  function volumeUnitsForSystem(sys){
    return [
      { key: "tsp",  label: `Teelöffel (tsp)`, toMl: sys.tspMl },
      { key: "tbsp", label: `Esslöffel (tbsp)`, toMl: sys.tbspMl },
      { key: "cup",  label: `Cup (${sys.name})`, toMl: sys.cupMl },
      { key: "ml",   label: "Milliliter (ml)", toMl: 1 },
      { key: "l",    label: "Liter (l)", toMl: 1000 }
    ];
  }

  // --- Weight units ---
  const WEIGHT_UNITS = [
    { key: "g",  label: "Gramm (g)",     toG: 1 },
    { key: "kg", label: "Kilogramm (kg)",toG: 1000 },
    { key: "oz", label: "Unze (oz)",     toG: 28.349523125 },
    { key: "lb", label: "Pfund (lb)",    toG: 453.59237 }
  ];

  function convertVolume(value, fromKey, toKey){
    const sys = getSystem();
    const units = volumeUnitsForSystem(sys);
    const from = units.find(u => u.key === fromKey);
    const to   = units.find(u => u.key === toKey);
    const ml = value * from.toMl;
    return ml / to.toMl;
  }

  function convertWeight(value, fromKey, toKey){
    const from = WEIGHT_UNITS.find(u => u.key === fromKey);
    const to   = WEIGHT_UNITS.find(u => u.key === toKey);
    const g = value * from.toG;
    return g / to.toG;
  }

  // --- Ingredients: approximate density in g/ml ---
  // Werte sind "küchenpraktische Näherungen". Je nach Messweise variieren sie.
  const INGREDIENTS = [
    { key:"water", label:"Wasser", gPerMl: 1.00 },
    { key:"milk", label:"Milch", gPerMl: 1.03 },
    { key:"oil", label:"Öl (pflanzlich)", gPerMl: 0.92 },
    { key:"honey", label:"Honig", gPerMl: 1.42 },
    { key:"sugar", label:"Zucker (weiß)", gPerMl: 0.85 },
    { key:"brown_sugar", label:"Brauner Zucker (gepackt)", gPerMl: 0.90 },
    { key:"flour", label:"Mehl (Weizen, gesiebt)", gPerMl: 0.52 },
    { key:"cocoa", label:"Kakaopulver", gPerMl: 0.45 },
    { key:"rice", label:"Reis (ungekocht)", gPerMl: 0.82 },
    { key:"oats", label:"Haferflocken", gPerMl: 0.40 },
    { key:"butter", label:"Butter", gPerMl: 0.96 },
    { key:"salt", label:"Salz (fein)", gPerMl: 1.20 }
  ];

  function ingredientConvert(amount, mode, ingredientKey){
    const sys = getSystem();
    const ing = INGREDIENTS.find(i => i.key === ingredientKey);
    const cupMl = sys.cupMl;

    if(mode === "cup_to_g"){
      const ml = amount * cupMl;
      const g = ml * ing.gPerMl;
      return { value: g, unit: "g", cupMl };
    } else { // g_to_cup
      const ml = amount / ing.gPerMl;
      const cups = ml / cupMl;
      return { value: cups, unit: "cups", cupMl };
    }
  }

  // --- UI Actions ---
  function refreshSystemUI(){
    const sys = getSystem();
    $("sysPill").textContent = `System: ${sys.name}`;
    $("cupLabelPill").textContent = `Cup: ${formatNumber(sys.cupMl, 3)} ml`;

    // refill volume selects but keep current selection if possible
    const volUnits = volumeUnitsForSystem(sys);
    const prevFrom = $("volFrom").value || "cup";
    const prevTo = $("volTo").value || "ml";

    fillSelect($("volFrom"), volUnits, volUnits.some(u=>u.key===prevFrom) ? prevFrom : "cup");
    fillSelect($("volTo"),   volUnits, volUnits.some(u=>u.key===prevTo)   ? prevTo   : "ml");

    doVol();
    doIng();
  }

  function doVol(){
    const v = parseNumber($("volValue").value);
    if(!isFinite(v)){
      showError($("volErr"), "Bitte eine Zahl eingeben (z. B. 1,5).");
      $("volOut").textContent = "—";
      return;
    }
    showError($("volErr"), "");
    const from = $("volFrom").value;
    const to = $("volTo").value;
    const res = convertVolume(v, from, to);
    $("volOut").textContent = `${formatNumber(res, $("volDecimals").value)} ${to}`;
    $("volHint").textContent = `${String(v).replace(".", ",")} ${from} → ${to}`;
  }

  function doWt(){
    const v = parseNumber($("wtValue").value);
    if(!isFinite(v)){
      showError($("wtErr"), "Bitte eine Zahl eingeben (z. B. 250).");
      $("wtOut").textContent = "—";
      return;
    }
    showError($("wtErr"), "");
    const from = $("wtFrom").value;
    const to = $("wtTo").value;
    const res = convertWeight(v, from, to);
    $("wtOut").textContent = `${formatNumber(res, $("wtDecimals").value)} ${to}`;
    $("wtHint").textContent = `${String(v).replace(".", ",")} ${from} → ${to}`;
  }

  function doIng(){
    const v = parseNumber($("ingAmount").value);
    if(!isFinite(v)){
      showError($("ingErr"), "Bitte eine Zahl eingeben (z. B. 1 oder 250).");
      $("ingOut").textContent = "—";
      return;
    }
    showError($("ingErr"), "");
    const mode = $("ingMode").value;
    const ingKey = $("ingredientSel").value;
    const ing = INGREDIENTS.find(i=>i.key===ingKey);
    const r = ingredientConvert(v, mode, ingKey);

    if(mode === "cup_to_g"){
      $("ingOut").textContent = `${formatNumber(r.value, $("ingDecimals").value)} g`;
      $("ingHint").textContent = `${String(v).replace(".", ",")} cup (${getSystem().name}) ${ing.label} → g (Cup = ${formatNumber(r.cupMl, 3)} ml)`;
    } else {
      $("ingOut").textContent = `${formatNumber(r.value, $("ingDecimals").value)} cups`;
      $("ingHint").textContent = `${String(v).replace(".", ",")} g ${ing.label} → cups (${getSystem().name}, Cup = ${formatNumber(r.cupMl, 3)} ml)`;
    }
  }

  // --- Init ---
  const globalDec = $("decGlobal").value;

  fillDecimals($("volDecimals"), globalDec);
  fillDecimals($("wtDecimals"), globalDec);
  fillDecimals($("ingDecimals"), globalDec);

  fillSelect($("wtFrom"), WEIGHT_UNITS, "g");
  fillSelect($("wtTo"),   WEIGHT_UNITS, "oz");

  fillSelect($("ingredientSel"), INGREDIENTS, "flour");

  // initial volume selects
  refreshSystemUI();

  // buttons
  $("volConvert").addEventListener("click", doVol);
  $("wtConvert").addEventListener("click", doWt);
  $("ingConvert").addEventListener("click", doIng);

  $("volSwap").addEventListener("click", () => { swapValues($("volFrom"), $("volTo")); doVol(); });
  $("wtSwap").addEventListener("click", () => { swapValues($("wtFrom"), $("wtTo")); doWt(); });

  $("ingSwap").addEventListener("click", () => {
    $("ingMode").value = ($("ingMode").value === "cup_to_g") ? "g_to_cup" : "cup_to_g";
    doIng();
  });

  // change handlers
  $("systemSel").addEventListener("change", refreshSystemUI);

  $("decGlobal").addEventListener("change", () => {
    fillDecimals($("volDecimals"), $("decGlobal").value);
    fillDecimals($("wtDecimals"), $("decGlobal").value);
    fillDecimals($("ingDecimals"), $("decGlobal").value);
    doVol(); doWt(); doIng();
  });

  // Enter = rechnen (je nach Panel)
  document.addEventListener("keydown", (e) => {
    if(e.key !== "Enter") return;
    const a = document.activeElement;
    if ($("volPanel").contains(a)) doVol();
    else if ($("wtPanel").contains(a)) doWt();
    else if ($("ingPanel").contains(a)) doIng();
    else { doVol(); doWt(); doIng(); }
  });

  // live update when typing (entspannt)
  ["volValue","volFrom","volTo","volDecimals"].forEach(id => $(id).addEventListener("input", doVol));
  ["wtValue","wtFrom","wtTo","wtDecimals"].forEach(id => $(id).addEventListener("input", doWt));
  ["ingAmount","ingMode","ingredientSel","ingDecimals"].forEach(id => $(id).addEventListener("input", doIng));

  // first compute
  doVol(); doWt(); doIng();
</script>
</body>
</html>
