<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rezeptrechner</title>

  <style>
    :root{
      color-scheme: dark;
      --bg:#0f1115;
      --panel:#151923;
      --panel2:#0b0d12;
      --text:#e8eaf0;
      --muted:#a6adbb;
      --border:rgba(255,255,255,.10);
      --shadow: 0 12px 35px rgba(0,0,0,.45);
      --radius: 16px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 14px;
    }

    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 980px){
      .wrap{ grid-template-columns: 1fr 1fr; }
    }

    .card{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .cardHeader{
      padding: 12px 12px 0 12px;
      display:flex;
      justify-content: space-between;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }

    .sub{
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      padding: 0 12px 10px 12px;
    }

    textarea{
      width:100%;
      min-height: 360px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel2);
      color: var(--text);
      padding: 12px;
      outline: none;
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    input[type="number"], input[type="text"]{
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel2);
      color: var(--text);
      padding: 10px 10px;
      outline: none;
      width: 100%;
    }

    .controls{
      padding: 12px;
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }

    .row{
      display:grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 500px){
      .row{ grid-template-columns: 1fr 1fr; }
    }

    .btns{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button{
      cursor:pointer;
      border: 1px solid var(--border);
      background: #111522;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 12px;
      font-weight: 600;
    }

    button:hover{ filter: brightness(1.08); }
    button:active{ transform: translateY(1px); }

    .label{
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .out{
      padding: 12px;
      display:grid;
      gap: 12px;
    }

    pre{
      margin:0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel2);
      padding: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    table{
      width: 100%;
      border-collapse: collapse;
      overflow:hidden;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel2);
    }
    th, td{
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      vertical-align: top;
      font-size: 13px;
    }
    th{
      text-align:left;
      color: var(--muted);
      font-weight: 700;
    }
    tr:last-child td{ border-bottom:none; }

    .tiny{
      font-size: 12px;
      color: var(--muted);
    }

    .footerRow{
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 12px 12px 12px;
    }

    .pill{
      border: 1px solid var(--border);
      background: #0f1320;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- INPUT -->
    <section class="card">
      <div class="cardHeader">
        <div class="pill">Recipe Scaler (Dark Mode)</div>
        <div class="pill" id="statusPill">Bereit</div>
      </div>

      <div style="padding: 0 12px 12px 12px;">
        <textarea id="recipeInput" placeholder="Rezept hier einfügen… (z.B. '- 1 1/2 cups flour')"></textarea>
      </div>

      <div class="controls">
        <div class="row">
          <div>
            <div class="label">Faktor</div>
            <input id="factorInput" type="number" step="0.01" min="0" value="1" />
          </div>
          <div>
            <div class="label">Dezimalstellen</div>
            <input id="roundInput" type="number" step="1" min="0" value="0" />
          </div>
        </div>

        <div class="btns">
          <button data-factor="0.5">½</button>
          <button data-factor="1">1×</button>
          <button data-factor="2">2×</button>
          <button data-factor="3">3×</button>
          <button id="swapDotComma">Komma ↔ Punkt</button>
          <button id="loadExample">Beispiel laden</button>
          <button id="clearAll">Leeren</button>
        </div>
      </div>

    </section>

    <!-- OUTPUT -->
    <section class="card">
      <div class="cardHeader">
        <div class="pill">Ausgabe</div>
        <div class="pill" id="recognizedPill">Erkannte Zeilen: 0</div>
      </div>

      <div class="out">
        <div>
          <div class="label">Skalierter Rezepttext</div>
          <pre id="scaledText"></pre>
        </div>

        <div>
          <div class="label">Zutatenliste (nur erkannte Mengen)</div>
          <div id="tableWrap"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // --- Helpers: parsing numbers like "1", "1.5", "1/2", "1 1/2"
    function parseQuantity(raw){
      // normalize: trim, replace comma decimal to dot (but keep if user wants comma later)
      const s = raw.trim();

      // mixed number: "1 1/2"
      const mixed = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
      if (mixed){
        const whole = Number(mixed[1]);
        const num = Number(mixed[2]);
        const den = Number(mixed[3]);
        if (den !== 0) return whole + (num/den);
      }

      // fraction: "1/2"
      const frac = s.match(/^(\d+)\s*\/\s*(\d+)$/);
      if (frac){
        const num = Number(frac[1]);
        const den = Number(frac[2]);
        if (den !== 0) return num/den;
      }

      // decimal/integer: "1.5" or "2"
      const dec = s.replace(",", "."); // accept comma input
      const n = Number(dec);
      if (!Number.isNaN(n)) return n;

      return null;
    }

    function formatNumber(n, decimals, preferComma){
      let x = n;

      if (typeof decimals === "number" && decimals > 0){
        x = Number(n.toFixed(decimals));
      } else if (decimals === 0){
        // no rounding
        x = n;
      }

      // pretty: remove "-0"
      if (Object.is(x, -0)) x = 0;

      // avoid crazy long floats if no rounding chosen
      let str = (decimals > 0) ? x.toFixed(decimals) : String(x);

      // trim trailing zeros for decimals when rounding not forced
      if (decimals === 0){
        // if it's a float with many digits, clamp
        if (str.includes(".")){
          str = String(Number(x.toPrecision(12)));
        }
      } else {
        // remove trailing zeros even when fixed
        str = str.replace(/(\.\d*?[1-9])0+$/,"$1").replace(/\.0+$/,"");
      }

      if (preferComma) str = str.replace(".", ",");
      return str;
    }

    // Try to detect quantity at start of line (with optional leading bullet/dash)
    // Examples:
    // "- 1 1/2 cups flour" -> quantity "1 1/2", unit "cups"
    // "2 eggs" -> quantity "2", unit maybe empty
    const UNIT_ALIASES = [
      // metric
      ["kg","kg"], ["kilogram","kg"], ["kilograms","kg"],
      ["g","g"], ["gram","g"], ["grams","g"],
      ["l","l"], ["liter","l"], ["liters","l"], ["litre","l"], ["litres","l"],
      ["ml","ml"], ["milliliter","ml"], ["milliliters","ml"], ["millilitre","ml"], ["millilitres","ml"],

      // volume cooking
      ["cup","cup"], ["cups","cup"],
      ["tbsp","tbsp"], ["tablespoon","tbsp"], ["tablespoons","tbsp"],
      ["tsp","tsp"], ["teaspoon","tsp"], ["teaspoons","tsp"],
      ["el","tbsp"], ["tl","tsp"], // DE shortcuts

      // weight imperial
      ["oz","oz"], ["ounce","oz"], ["ounces","oz"],
      ["lb","lb"], ["lbs","lb"], ["pound","lb"], ["pounds","lb"],

      // small units
      ["pinch","pinch"], ["pinches","pinch"],
      ["dash","dash"], ["dashes","dash"],
      ["piece","piece"], ["pieces","piece"],
      ["stk","piece"], ["stück","piece"], ["stueck","piece"]
    ];

    function normalizeUnit(u){
      const x = u.toLowerCase().trim();
      for (const [alias, norm] of UNIT_ALIASES){
        if (x === alias) return norm;
      }
      return u.trim(); // unknown unit keep as-is
    }

    function parseLine(line){
      const original = line;

      // keep empty lines
      if (!line.trim()) return { type: "empty", original, scaled: original };

      // remove leading bullets for parsing, but keep for reconstruction
      const bulletMatch = line.match(/^(\s*[-*•]\s+|\s*\d+\.\s+)?(.*)$/);
      const bullet = bulletMatch ? (bulletMatch[1] || "") : "";
      const rest = bulletMatch ? bulletMatch[2] : line;

      // quantity pattern at start: mixed/fraction/decimal/integer
      // e.g. "1 1/2", "1/2", "1.5", "2"
      const qMatch = rest.match(/^(\d+\s+\d+\s*\/\s*\d+|\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?)(\s+|$)(.*)$/);
      if (!qMatch){
        return { type:"text", original, scaled: original };
      }

      const qRaw = qMatch[1];
      const qty = parseQuantity(qRaw);
      if (qty === null) return { type:"text", original, scaled: original };

      const afterQty = (qMatch[3] || "").trim();

      // optional unit is first token if it's letters (or letters+.)
      const unitMatch = afterQty.match(/^([A-Za-zÄÖÜäöüß]+\.?)(\s+|$)(.*)$/);
      let unit = "";
      let item = afterQty;

      if (unitMatch){
        unit = normalizeUnit(unitMatch[1].replace(/\.$/,""));
        item = (unitMatch[3] || "").trim();
      }

      return {
        type:"ingredient",
        original,
        bullet,
        qty,
        unit,
        item,
        scaled: original
      };
    }

    function scaleRecipe(text, factor, decimals, preferComma){
      const lines = text.split(/\r?\n/);
      const parsed = lines.map(parseLine);

      let recognized = 0;
      const scaledLines = [];
      const rows = [];

      for (const p of parsed){
        if (p.type === "ingredient"){
          recognized++;
          const newQty = p.qty * factor;
          const qtyStr = formatNumber(newQty, decimals, preferComma);

          // rebuild line:
          const unitPart = p.unit ? " " + p.unit : "";
          const itemPart = p.item ? " " + p.item : "";

          const scaledLine = `${p.bullet}${qtyStr}${unitPart}${itemPart}`.trimEnd();
          scaledLines.push(scaledLine);

          rows.push({
            original: `${formatNumber(p.qty, 0, preferComma)}${p.unit ? " " + p.unit : ""}${p.item ? " " + p.item : ""}`.trim(),
            scaled: `${qtyStr}${unitPart}${itemPart}`.trim(),
            qty: qtyStr,
            unit: p.unit || "",
            item: p.item || ""
          });
        } else if (p.type === "empty"){
          scaledLines.push("");
        } else {
          scaledLines.push(p.original);
        }
      }

      return { scaledText: scaledLines.join("\n"), rows, recognized };
    }

    function renderTable(rows){
      if (!rows.length){
        return `<div class="tiny">Noch keine erkannten Zutatenzeilen.</div>`;
      }

      const esc = (s) => String(s)
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");

      let html = `<table>
        <thead>
          <tr>
            <th style="width:18%;">Menge</th>
            <th style="width:14%;">Einheit</th>
            <th>Zutat</th>
            <th style="width:34%;">Skalierte Zeile</th>
          </tr>
        </thead>
        <tbody>`;

      for (const r of rows){
        html += `<tr>
          <td>${esc(r.qty)}</td>
          <td>${esc(r.unit)}</td>
          <td>${esc(r.item)}</td>
          <td>${esc(r.scaled)}</td>
        </tr>`;
      }
      html += `</tbody></table>`;
      return html;
    }

    // --- UI wiring
    const recipeInput = document.getElementById("recipeInput");
    const factorInput = document.getElementById("factorInput");
    const roundInput = document.getElementById("roundInput");
    const scaledTextEl = document.getElementById("scaledText");
    const tableWrap = document.getElementById("tableWrap");
    const recognizedPill = document.getElementById("recognizedPill");
    const statusPill = document.getElementById("statusPill");

    let preferComma = false;

    function getDecimals(){
      const v = Number(roundInput.value);
      if (Number.isNaN(v) || v < 0) return 0;
      return v;
    }

    function update(){
      const text = recipeInput.value || "";
      const factor = Number(String(factorInput.value).replace(",", "."));
      const decimals = getDecimals();

      if (!factor || factor <= 0 || Number.isNaN(factor)){
        statusPill.textContent = "Faktor ungültig";
        scaledTextEl.textContent = "";
        tableWrap.innerHTML = `<div class="tiny">Bitte einen Faktor > 0 setzen.</div>`;
        recognizedPill.textContent = "Erkannte Zeilen: 0";
        return;
      }

      const res = scaleRecipe(text, factor, decimals, preferComma);
      statusPill.textContent = `Faktor: ${preferComma ? String(factor).replace(".", ",") : factor}`;
      scaledTextEl.textContent = res.scaledText;
      tableWrap.innerHTML = renderTable(res.rows);
      recognizedPill.textContent = `Erkannte Zeilen: ${res.recognized}`;
    }

    document.querySelectorAll("button[data-factor]").forEach(btn => {
      btn.addEventListener("click", () => {
        factorInput.value = btn.getAttribute("data-factor");
        update();
      });
    });

    document.getElementById("swapDotComma").addEventListener("click", () => {
      preferComma = !preferComma;
      statusPill.textContent = preferComma ? "Zahlen: Komma" : "Zahlen: Punkt";
      update();
    });

    document.getElementById("loadExample").addEventListener("click", () => {
      recipeInput.value =
`Pancakes
- 1 1/2 cups flour
- 1 tbsp sugar
- 2 tsp baking powder
- 1/2 tsp salt
- 1 1/4 cups milk
- 1 egg
- 3 tbsp butter`;
      factorInput.value = 1;
      roundInput.value = 2;
      preferComma = false;
      update();
    });

    document.getElementById("clearAll").addEventListener("click", () => {
      recipeInput.value = "";
      factorInput.value = 1;
      roundInput.value = 0;
      update();
    });

    recipeInput.addEventListener("input", update);
    factorInput.addEventListener("input", update);
    roundInput.addEventListener("input", update);

    // initial
    scaledTextEl.textContent = "Füge links dein Rezept ein 🙂";
  </script>
</body>
</html>
